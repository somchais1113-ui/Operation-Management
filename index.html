<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OM Final Study Portal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&display=swap');
        
        body {
            margin: 0; padding: 0;
            font-family: 'Kanit', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .header { text-align: center; color: white; margin-bottom: 40px; }
        
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 90%; max-width: 1000px;
        }

        .menu-item {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            text-decoration: none;
            color: white;
            transition: 0.3s;
        }

        .menu-item:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.2);
        }

        .icon { font-size: 40px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🚀 OM Final Study Portal</h1>
        <p>เลือก Module ที่ต้องการทบทวน</p>
    </div>

    <div class="menu-grid">
        <!-- เชื่อมไป Module 1 -->
        <a href="module1.html" class="menu-item">
            <div class="icon">⚙️</div>
            <h3>Module 1</h3>
            <p>Process Analysis</p>
        </a>

        <!-- เชื่อมไป Module 2 -->
        <a href="module2.html" class="menu-item">
            <div class="icon">📦</div>
            <h3>Module 2</h3>
            <p>Inventory Management</p>
        </a>

        <!-- เชื่อมไป Case Study -->
        <a href="casestudy.html" class="menu-item">
            <div class="icon">📝</div>
            <h3>Case Study</h3>
            <p>Analysis & Solutions</p>
        </a>
        
        <!-- เพิ่ม Module 3-5 ตามลำดับ -->
    </div>

</body>
</html>
